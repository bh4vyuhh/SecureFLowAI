spring:
  application:
    name: secureflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/secureflow
    username: secureflow
    password: secureflow123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.jdbc: DEBUG
    com.zaxxer.hikari: DEBUG

#debug: true

server:
  port: 9090