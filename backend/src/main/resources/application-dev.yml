spring:
  datasource:
    url: jdbc:h2:mem:secureflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 9090

crypto:
  master-key: SecureFlowAI-Dev-Banking-Key-32BytesLong!
  hmac-salt: SecureFlowAI-Dev-HMAC-Token-Salt-2026

jwt:
  secret: SecureFlowAI-Dev-JWT-SecretKey-2026-BankingGrade-32Bytes!
