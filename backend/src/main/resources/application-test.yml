spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 0

crypto:
  master-key: SecureFlowAI-Test-Banking-Key-32BytesLong!
  hmac-salt: SecureFlowAI-Test-HMAC-Token-Salt-2026

jwt:
  secret: SecureFlowAI-Test-JWT-SecretKey-2026-BankingGrade-32Bytes!
